:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font:600 .95rem inherit;cursor:pointer;text-decoration:none;min-height:46px;transition:transform .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.pri{background:var(--g);color:#fff}.pri:hover{background:#163a2b}
.out{background:transparent;border:1.5px solid var(--g);color:var(--g)}
.dg{background:#fbeae8;color:var(--red)}
.sm{padding:8px 14px;min-height:38px;font-size:.85rem}
.wa{background:var(--wa);color:#fff}

/* ---- Login ---- */
#lockScreen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 18px}
.lockCard{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(31,77,58,.1);text-align:center}
.lockCard img{width:88px;height:88px;margin:0 auto 14px;border-radius:20px}
.lockCard h1{font-size:1.3rem;margin-bottom:4px}
.lockCard p.sub{color:var(--mut);font-size:.88rem;margin-bottom:22px}
.lockCard form{display:grid;gap:14px;text-align:left}
.lockCard label{display:grid;gap:5px;font-weight:600;font-size:.85rem}
.lockCard input{padding:12px 13px;border:1.5px solid #cfd9d2;border-radius:10px;width:100%;background:#fff}
.err{color:var(--red);font-size:.85rem}
.fp{background:none;border:0;color:var(--g2);font-weight:600;font-size:.83rem;cursor:pointer;text-decoration:underline;padding:4px 0}

/* ---- App shell ---- */
#appShell{display:none;min-height:100vh;min-height:100dvh}
#appShell.on{display:block}
.topbar{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:10;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar img{width:32px;height:32px;border-radius:8px;flex:none}
.topbar .ttl{font-weight:800;font-size:1rem;flex:1;min-width:0}
.topbar .ttl small{display:block;font-weight:500;font-size:.72rem;opacity:.8}
.topbar a,.topbar button{color:#fff;border-color:rgba(255,255,255,.5)}
.layout{display:flex;min-height:calc(100vh - 54px)}
.side{width:var(--nav-w);flex:none;background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:none}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px 14px;font-weight:600;color:var(--ink);cursor:pointer;margin-bottom:2px}
.side button.on{background:var(--g);color:#fff}
.side button i{font-style:normal;width:20px;text-align:center}
main{flex:1;min-width:0;padding:18px 16px 90px}
@media(min-width:880px){.side{display:block}main{padding:24px 28px}.bottomnav{display:none}}
.wrapx{max-width:820px;margin:0 auto}
h2{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:18px;font-size:.9rem}
.statgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.6rem;color:var(--g)}
.stat span{font-size:.82rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 10px rgba(31,77,58,.06)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.tabs button{white-space:nowrap;border:0;background:#eef4ef;border-radius:99px;padding:8px 14px;font:600 .85rem inherit;cursor:pointer}
.tabs .on{background:var(--g);color:#fff}
.li{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.li>div{flex:1;min-width:0}.li small{color:var(--mut);display:block}
.li img{width:52px;height:52px;object-fit:cover;border-radius:10px;background:#e8efe9;flex:none}
.li b{overflow-wrap:anywhere}
.empty{padding:34px 18px;text-align:center;color:var(--mut);background:#fff;border:1.5px dashed var(--line);border-radius:var(--r)}
label{display:grid;gap:4px;font-weight:600;font-size:.85rem;margin-bottom:12px}
input,select,textarea{padding:11px 12px;border:1.5px solid #cfd9d2;border-radius:10px;width:100%;background:#fff}
textarea{min-height:88px}
label.ck{display:flex;align-items:center;gap:10px}label.ck input{width:auto}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.thumb{position:relative}
.thumb img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.thumb button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:var(--red);color:#fff;cursor:pointer}
.errmsg{color:var(--red);font-size:.85rem;margin:-6px 0 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,25,18,.6)}
.dh{position:sticky;top:0;background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);z-index:2}
.db{padding:18px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:#163a2b;color:#fff;padding:12px 20px;border-radius:12px;z-index:99;transition:transform .3s;max-width:92vw}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav button{flex:1;background:none;border:0;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--mut);cursor:pointer}
.bottomnav button i{font-style:normal;font-size:1.25rem}
.bottomnav button.on{color:var(--g)}
.load{min-height:70vh;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 if(!/^image\//.test(file.type))return no(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
 if(file.size>10*1024*1024)return no(new Error('Ukuran foto maksimal 10 MB.'));

 im.onerror=()=>no(new Error('Foto tidak bisa dibaca.'));im.src=u})}

   <div class="stat"><b>${S.rooms.length-av}</b><span>Kamar terisi</span></div>
   <div class="stat"><b>${S.gallery.length}</b><span>Foto galeri</span></div>
   <div class="stat"><b>${S.facilities.filter(f=>f.active).length}</b><span>Fasilitas aktif</span></div>
   <div class="stat"><b>${S.faqs.length}</b><span>FAQ</span></div>
  </div>
  <div class="card" style="padding:20px"><h3 style="margin-bottom:10px">Jalan pintas</h3>
   <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn pri sm" data-go="rooms">+ Tambah kamar</button>
    <button class="btn out sm" data-go="gallery">+ Tambah foto</button>
    <button class="btn out sm" data-go="profile">Ubah profil</button>
    <a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/${String(S.profile.wa).replace(/\D/g,'').replace(/^0/,'62')}">Buka WhatsApp</a>
   </div></div>`;
  tb.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;drawNav();renderTab()});return}
 if(tab==='profile'){tb.innerHTML='<h2>Profil</h2><p class="sub">Nama, WhatsApp, alamat, peraturan, dan teks tampilan lainnya.</p><button class="btn pri" id="ep" style="width:100%">Edit profil</button>';$('#ep').onclick=()=>form(null,PROF,S.profile,'Profil');return}
 if(tab==='data'){dataView(tb);return}
 const E=ENT[tab],l=S[tab];
 tb.innerHTML=`<h2>${E.t}</h2><button class="btn pri" id="add" style="width:100%;margin-bottom:6px">+ Tambah ${E.t}</button>`+
  (l.length?`<div class="card" style="padding:0 16px">`+l.map(x=>{const [a,b,im]=E.l(x);return `<div class="li">${im?`<img src="${src(im)}" alt="">`:''}<div><b>${esc(a)}</b><small>${esc(b)}</small></div><button class="btn sm out" data-e="${x.id}">Edit</button><button class="btn sm dg" data-d="${x.id}" aria-label="Hapus">Hapus</button></div>`}).join('')+`</div>`:`<div class="empty">Belum ada ${E.t.toLowerCase()}. Tekan tombol di atas untuk menambahkan.</div>`);
 $('#add').onclick=()=>form(tab,E.f,{status:'Tersedia',period:'/bulan',active:true,order:l.length+1,photos:[]},'Tambah '+E.t);
 tb.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(tab,E.f,l.find(x=>x.id==b.dataset.e),'Edit '+E.t));
 tb.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))return;try{await del(tab,b.dataset.d);await load();await gc();renderTab();toast('Data dihapus')}catch(e){toast('Gagal menghapus: '+e.message,1)}})}

function form(store,fields,v,title){W={};
 frm.innerHTML=`<div class="dh"><b>${esc(title)}</b><button class="btn sm out" type="button" id="cx">Batal</button></div><form class="db" id="ff" novalidate>${fields.map(([k,l,t,req,o])=>{
  if(t==='img'||t==='imgs'){W[k]=t==='img'?(v[k]?[v[k]]:[]):[...(v[k]||[])];return `<label>${l}<div class="thumbs" id="th-${k}"></div><input type="file" accept="image/*" ${t==='imgs'?'multiple':''} data-k="${k}" data-m="${t}"><span class="errmsg" id="e-${k}"></span></label>`}
  if(t==='check')return `<label class="ck"><input type="checkbox" name="${k}" ${v[k]?'checked':''}>${l}</label>`;
  if(t==='select')return `<label>${l}<select name="${k}">${o.map(x=>`<option ${x===v[k]?'selected':''}>${x}</option>`).join('')}</select></label>`;
  if(t==='textarea')return `<label>${l}<textarea name="${k}">${esc(v[k])}</textarea><span class="errmsg" id="e-${k}"></span></label>`;
  return `<label>${l}<input name="${k}" type="${t}" ${t==='number'?'min="0" inputmode="numeric"':''} value="${esc(v[k])}"><span class="errmsg" id="e-${k}"></span></label>`}).join('')}<button class="btn pri" style="width:100%">Simpan</button></form>`;
 frm.showModal();$('#cx').onclick=()=>frm.close();
 const draw=k=>{const el=$('#th-'+k);if(!el)return;el.innerHTML=W[k].map((id,i)=>`<div class="thumb"><img src="${src(id)}" alt="Pratinjau"><button type="button" data-i="${i}" aria-label="Hapus foto">×</button></div>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{W[k].splice(+b.dataset.i,1);draw(k)})};
 Object.keys(W).forEach(draw);
 frm.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.k,er=$('#e-'+k);er.textContent='';
  for(const f of inp.files){try{const d=await b2d(await compress(f));if(d.length>950000)throw new Error('Foto terlalu besar, pilih foto lain.');const id=await put('images',{data:d});urls[id]=d;inp.dataset.m==='img'?W[k]=[id]:W[k].push(id)}catch(e){er.textContent=e.message}}inp.value='';draw(k)});
 $('#ff').onsubmit=async e=>{e.preventDefault();const o={...v};let bad=0;
  for(const [k,l,t,req] of fields){frm.querySelectorAll('.errmsg').forEach(x=>x.id==='e-'+k&&(x.textContent=''));
   if(t==='img'||t==='imgs'){o[k]=t==='img'?(W[k][0]??null):W[k];if(req&&!W[k].length){$('#e-'+k).textContent='Pilih foto terlebih dahulu.';bad=1}continue}
   const el=frm.querySelector(`[name=${k}]`);let val=t==='check'?el.checked:t==='number'?(el.value===''?0:Number(el.value)):el.value.trim();
   if(req&&val===''){$('#e-'+k).textContent='Wajib diisi.';bad=1}
   if(k==='wa'&&!/^(\+?62|0)8\d{7,12}$/.test(val.replace(/[\s-]/g,''))){$('#e-wa').textContent='Nomor tidak valid, contoh: 082332651558.';bad=1}
   if((k==='maps'||k==='mapsEmbed')&&val&&!/^https?:\/\//.test(val)){$('#e-'+k).textContent='Harus diawali https://';bad=1}
   o[k]=val}
  if(bad)return;delete o.demo;
  try{if(store){if(store==='gallery'&&o.cover)for(const g of S.gallery)if(g.cover&&g.id!==o.id)await put('gallery',{...g,cover:false});await put(store,o)}else await put('kv',{...o,key:'profile'});
   await load();await gc();frm.close();renderTab();toast('Tersimpan')}catch(er){toast('Gagal menyimpan: '+er.message,1)}}}

async function exportDB(){try{const d={app:'kost-khalifa',version:1,date:new Date().toISOString()};
 for(const s of STORES)d[s]=await all(s);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup-kost-khalifa-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup diunduh')}catch(e){toast('Gagal export: '+e.message,1)}}
async function importDB(f){try{const d=JSON.parse(await f.text());if(d.app!=='kost-khalifa')throw new Error('Bukan file backup Kost Khalifa.');
 if(!confirm('Restore akan MENGGANTI semua data saat ini. Lanjutkan?'))return;
 for(const s of STORES){await clr(s);for(const x of d[s]||[]){if(s==='kv'&&x.key==='profile'){delete x.pin;delete x.pinHash}await put(s,x)}}
 await load();renderTab();toast('Data berhasil dipulihkan')}catch(e){toast('Gagal import: '+e.message,1)}}
function dataView(tb){tb.innerHTML=`<h2>Data</h2><div class="card" style="padding:18px;margin-bottom:12px"><h3>Backup / Export</h3><p class="sub">Unduh semua data termasuk foto dalam satu file JSON.</p><button class="btn pri" id="ex">Export data</button></div><div class="card" style="padding:18px"><h3>Restore / Import</h3><p class="sub">Pilih file backup. Data saat ini akan diganti.</p><input type="file" accept="application/json,.json" id="im"></div><p class="sub" style="margin-top:14px">Data tersimpan di Firebase Firestore dan otomatis sama di semua perangkat, termasuk aplikasi ini dan website publik.</p>`;
 $('#ex').onclick=exportDB;$('#im').onchange=e=>e.target.files[0]&&importDB(e.target.files[0])}

/* ---------- Login / logout ---------- */
function showApp(){$('#lockScreen').style.display='none';$('#appShell').classList.add('on');drawNav();renderTab()}
function showLock(){$('#appShell').classList.remove('on');$('#lockScreen').style.display='grid'}
$('#pf').onsubmit=async e=>{e.preventDefault();const er=$('#pe');er.textContent='';
 try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){er.textContent='Email atau password salah.';return}
 try{await seed();await load();toast('Selamat datang kembali')}catch(x){toast('Login berhasil, tapi tidak punya izin tulis. Cek UID di Firestore Rules.',1)}
 showApp()};
$('#fp').onclick=async()=>{const email=$('#em').value.trim();if(!email){$('#pe').textContent='Isi email terlebih dahulu, lalu tekan "Lupa password?" lagi.';return}
 try{await sendPasswordResetEmail(auth,email);toast('Link reset password dikirim ke '+email)}catch(e){$('#pe').textContent='Gagal mengirim email reset: '+e.message}};
$('#lo').onclick=async()=>{await signOut(auth);showLock()};

/* ---------- Init ---------- */
(async()=>{try{
 if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('ISI_'))throw new Error('firebaseConfig belum diisi');
 const app=initializeApp(firebaseConfig);db=initializeFirestore(app,{ignoreUndefinedProperties:true});auth=getAuth(app);
 onAuthStateChanged(auth,async u=>{
  if(u){try{await load()}catch(e){}showApp()}else showLock()});
}catch(e){document.body.innerHTML=`<div class="load">Gagal memuat aplikasi (${esc(e.message)}). Periksa koneksi internet dan konfigurasi Firebase.</div>`}})();
</script>
</body>
