function compress(file,max=1024){return new Promise((ok,no)=>{
 if(!/^image\//.test(file.type))return no(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
 if(file.size>10*1024*1024)return no(new Error('Ukuran foto maksimal 10 MB.'));

<section id="fasilitas" style="background:#fff"><div class="wrap"><h2>Fasilitas</h2><p class="sub">Fasilitas yang tersedia di ${esc(P.name)}.</p>${fs.length?`<div class="grid fgrid">${fs.map(f=>`<div class="card fac"><i aria-hidden="true">${esc(f.icon)}</i><b>${esc(f.name)}</b><p>${esc(f.desc)}</p></div>`).join('')}</div>`:'<div class="empty">Fasilitas belum ditambahkan.</div>'}</div></section>
<section id="galeri"><div class="wrap"><h2>Galeri Foto</h2><p class="sub">Kondisi ${esc(P.name)}.</p>${S.gallery.length?`<div class="gal">${S.gallery.map(g=>`<figure tabindex="0" role="button" data-g="${g.id}"><img loading="lazy" src="${src(g.img)}" alt="${esc(g.caption||P.name)}">${g.caption?`<figcaption>${esc(g.caption)}</figcaption>`:''}</figure>`).join('')}</div>`:'<div class="empty">Foto belum diunggah. Pemilik dapat menambahkannya lewat menu Kelola.</div>'}</div></section>
<section id="harga" style="background:#fff"><div class="wrap"><h2>Harga</h2><p class="sub">Bandingkan harga tiap kamar.</p>${S.rooms.length?`<div class="tw card"><table><thead><tr><th>Kamar</th><th>Luas</th><th>Harga</th><th>Status</th></tr></thead><tbody>${S.rooms.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.size)||'–'}</td><td><b>${rp(r.price)}</b> <small>${esc(r.period)}</small></td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Harga belum tersedia.</div>'}<p class="sub" style="margin:14px 0">${esc(P.priceNote)}</p><a class="btn wa" target="_blank" rel="noopener" href="${waLink('Halo, saya ingin cek ketersediaan kamar di '+P.name+'.')}">Cek Ketersediaan</a></div></section>
<section id="lokasi"><div class="wrap"><h2>Lokasi</h2><p class="sub">📍 ${esc(P.address)}</p><iframe class="map" title="Peta lokasi ${esc(P.name)}" loading="lazy" src="${esc(embedUrl())}"></iframe><p style="margin-top:14px"><a class="btn pri" target="_blank" rel="noopener" href="${esc(mapsUrl())}">Buka Google Maps</a></p></div></section>
<section id="faq" style="background:#fff"><div class="wrap" style="max-width:780px"><h2>Pertanyaan umum</h2><p class="sub">Jawaban singkat untuk pertanyaan yang sering muncul.</p>${S.faqs.length?S.faqs.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join(''):'<div class="empty">FAQ belum ditambahkan.</div>'}</div></section>
<div class="cta"><div class="wrap"><h2>${esc(P.cta)}</h2><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">💬 Tanya via WhatsApp</a></div></div>
<footer><div class="wrap"><b style="font-size:1.1rem">${esc(P.name)}</b><span>📍 ${esc(P.address)}</span><span>📞 <a href="${waLink()}" target="_blank" rel="noopener">${esc(P.wa)}</a> (WhatsApp)</span><a href="${esc(mapsUrl())}" target="_blank" rel="noopener">Buka Google Maps</a><span>© ${new Date().getFullYear()} ${esc(P.name)}. Hak cipta dilindungi.</span></div></footer>`;
 $('#waStick').href=waLink();roomsView();
 $('#burger').onclick=e=>{const o=$('#links').classList.toggle('open');e.target.setAttribute('aria-expanded',o)};
 $('#links').onclick=e=>{if(e.target.tagName==='A')$('#links').classList.remove('open')};
 $('#openAdm').onclick=openAdmin;
 document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===b));roomsView()});
 document.querySelectorAll('[data-g]').forEach(f=>{const o=()=>{const g=S.gallery.find(x=>x.id==f.dataset.g);showImg(src(g.img),g.caption)};f.onclick=o;f.onkeydown=e=>e.key==='Enter'&&o()})}
let filt='Semua';
function showImg(s,c){$('#lbi').src=s;$('#lbi').alt=c||'Foto';$('#lbc').textContent=c||'Foto';lb.showModal()}
function roomsView(){const l=S.rooms.filter(r=>filt==='Semua'||r.status===filt),el=$('#rooms');
 el.innerHTML=l.length?l.map(r=>{const ph=(r.photos||[])[0];return `<article class="card room"><div class="ph" data-r="${r.id}"><img loading="lazy" src="${src(ph)}" alt="${esc(r.name)}"><span class="pill ${r.status==='Terisi'?'x':''}">${esc(r.status)}</span>${r.demo?'<span class="pill d">Contoh</span>':''}</div><div class="b"><h3>${esc(r.name)}</h3><div class="price">${rp(r.price)} <small>${esc(r.period)}</small></div>${r.size?`<small>Luas ${esc(r.size)}</small>`:''}<div class="tags">${(r.feats||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div><p style="color:var(--mut);font-size:.9rem">${esc(r.desc)}</p><a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(roomMsg(r))}">Tanya Kamar Ini</a></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1">${S.rooms.length?'Tidak ada kamar dengan status ini.':'Belum ada kamar. Pemilik dapat menambahkannya lewat menu Kelola.'}</div>`;
 el.querySelectorAll('.ph').forEach(p=>p.onclick=()=>{const r=S.rooms.find(x=>x.id==p.dataset.r);showImg(src((r.photos||[])[0]),r.name)})}
/* ---------- Admin ---------- */
const ICONS=['🚿','📶','🏍️','💡','💧','🍳','🛏️','🛡️','❄️','🧺','📺','🌳','🚗','🧹','☕'];
const ENT={
 rooms:{t:'Kamar',f:[['name','Nama kamar / unit','text',1],['price','Harga (Rp)','number',1],['period','Periode harga','select',0,['/bulan','/tahun','/minggu','/hari']],['status','Status','select',0,['Tersedia','Terisi']],['size','Luas (mis. 3x3 m)','text'],['desc','Deskripsi','textarea'],['feats','Fasilitas kamar (pisahkan dengan koma)','text'],['photos','Foto kamar','imgs'],['order','Urutan tampil','number']],l:r=>[r.name+(r.demo?' (contoh)':''),rp(r.price)+r.period+' · '+r.status,(r.photos||[])[0]]},
 facilities:{t:'Fasilitas',f:[['name','Nama fasilitas','text',1],['icon','Ikon','select',0,ICONS],['desc','Keterangan singkat','text'],['active','Tampilkan di website','check'],['order','Urutan tampil','number']],l:f=>[f.icon+' '+f.name+(f.demo?' (contoh)':''),f.active?'Aktif':'Nonaktif']},
 gallery:{t:'Foto',f:[['img','Foto','img',1],['caption','Caption','text'],['cover','Jadikan foto utama (cover hero)','check'],['order','Urutan tampil','number']],l:g=>[g.caption||'(tanpa caption)',g.cover?'Foto utama':'',g.img]},
 faqs:{t:'FAQ',f:[['q','Pertanyaan','text',1],['a','Jawaban','textarea',1],['order','Urutan tampil','number']],l:f=>[f.q+(f.demo?' (contoh)':''),f.a.slice(0,60)]}};
const PROF=[['name','Nama usaha','text',1],['tagline','Headline','text'],['desc','Deskripsi','textarea'],['wa','Nomor WhatsApp (mis. 082332651558)','text',1],['waMsg','Pesan WhatsApp otomatis','textarea'],['address','Alamat','text',1],['maps','Link Google Maps (tombol "Buka Google Maps")','text'],['mapsEmbed','URL embed Google Maps (opsional; dari Share > Embed a map, isi bagian src)','text'],['hero','Foto utama (hero)','img'],['highlights','Keunggulan (satu per baris)','textarea'],['area','Informasi lingkungan sekitar','text'],['priceNote','Catatan harga','text'],['cta','Teks CTA','text']];
let tab='profile',W={};
function openAdmin(){adm.showModal();unlocked?adminView():lockView()}
function lockView(){adm.innerHTML=`<div class="dh"><b>Kelola Website</b><button class="btn sm out" onclick="adm.close()">Tutup</button></div><form class="db" id="pf"><label>Email admin<input id="em" type="email" autocomplete="username" autofocus></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="err" id="pe"></div><button class="btn pri" style="width:100%">Masuk</button></form>`;
 $('#pf').onsubmit=async e=>{e.preventDefault();const er=$('#pe');er.textContent='';
  try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){er.textContent='Email atau password salah.';return}
  unlocked=true;
  try{await seed();await load();render()}catch(x){toast('Login berhasil, tapi tidak punya izin tulis. Cek UID di Firestore Rules.',1)}
  adminView()}}
const TABS=[['profile','Profil'],['rooms','Kamar'],['facilities','Fasilitas'],['gallery','Galeri'],['faqs','FAQ'],['data','Data']];
function adminView(){adm.innerHTML=`<div class="dh"><b>Kelola Website</b><span style="display:flex;gap:8px"><button class="btn sm out" id="lo">Keluar</button><button class="btn sm out" onclick="adm.close()">Selesai</button></span></div><div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div><div class="db" id="tb"></div>`;
 $('#lo').onclick=async()=>{await signOut(auth);unlocked=false;adm.close();toast('Anda sudah keluar')};
 adm.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;adminView()});
 const tb=$('#tb');
 if(tab==='profile'){tb.innerHTML='<button class="btn pri" id="ep" style="width:100%">Edit profil & pengaturan</button><p class="sub" style="margin-top:12px">Nama, WhatsApp, alamat, link Google Maps, foto utama, dan teks CTA.</p>';$('#ep').onclick=()=>form(null,PROF,S.profile,'Profil')}
 else if(tab==='data')dataView(tb);
 else{const E=ENT[tab],l=S[tab];tb.innerHTML=`<button class="btn pri" id="add" style="width:100%;margin-bottom:8px">+ Tambah ${E.t}</button>`+(l.length?l.map(x=>{const [a,b,im]=E.l(x);return `<div class="li">${im?`<img src="${src(im)}" alt="">`:''}<div><b>${esc(a)}</b><small>${esc(b)}</small></div><button class="btn sm out" data-e="${x.id}">Edit</button><button class="btn sm dg" data-d="${x.id}" aria-label="Hapus">Hapus</button></div>`}).join(''):`<div class="empty">Belum ada ${E.t.toLowerCase()}. Tekan tombol di atas untuk menambahkan.</div>`);
  $('#add').onclick=()=>form(tab,E.f,{status:'Tersedia',period:'/bulan',active:true,order:l.length+1,photos:[]},'Tambah '+E.t);
  tb.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(tab,E.f,l.find(x=>x.id==b.dataset.e),'Edit '+E.t));
  tb.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))return;try{await del(tab,b.dataset.d);await load();await gc();render();adminView();toast('Data dihapus')}catch(e){toast('Gagal menghapus: '+e.message,1)}})}}
function form(store,fields,v,title){W={};
 frm.innerHTML=`<div class="dh"><b>${esc(title)}</b><button class="btn sm out" type="button" id="cx">Batal</button></div><form class="db" id="ff" novalidate>${fields.map(([k,l,t,req,o])=>{
  if(t==='img'||t==='imgs'){W[k]=t==='img'?(v[k]?[v[k]]:[]):[...(v[k]||[])];return `<label>${l}<div class="thumbs" id="th-${k}"></div><input type="file" accept="image/*" ${t==='imgs'?'multiple':''} data-k="${k}" data-m="${t}"><span class="err" id="e-${k}"></span></label>`}
  if(t==='check')return `<label class="ck"><input type="checkbox" name="${k}" ${v[k]?'checked':''}>${l}</label>`;
  if(t==='select')return `<label>${l}<select name="${k}">${o.map(x=>`<option ${x===v[k]?'selected':''}>${x}</option>`).join('')}</select></label>`;
  if(t==='textarea')return `<label>${l}<textarea name="${k}">${esc(v[k])}</textarea><span class="err" id="e-${k}"></span></label>`;
  return `<label>${l}<input name="${k}" type="${t}" ${t==='number'?'min="0" inputmode="numeric"':''} value="${k==='pin'?'':esc(v[k])}"><span class="err" id="e-${k}"></span></label>`}).join('')}<button class="btn pri" style="width:100%">Simpan</button></form>`;
 frm.showModal();$('#cx').onclick=()=>frm.close();
 const draw=k=>{const el=$('#th-'+k);if(!el)return;el.innerHTML=W[k].map((id,i)=>`<div class="thumb"><img src="${src(id)}" alt="Pratinjau"><button type="button" data-i="${i}" aria-label="Hapus foto">×</button></div>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{W[k].splice(+b.dataset.i,1);draw(k)})};
 Object.keys(W).forEach(draw);
 frm.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.k,er=$('#e-'+k);er.textContent='';
  for(const f of inp.files){try{const d=await b2d(await compress(f));if(d.length>950000)throw new Error('Foto terlalu besar, pilih foto lain.');const id=await put('images',{data:d});urls[id]=d;inp.dataset.m==='img'?W[k]=[id]:W[k].push(id)}catch(e){er.textContent=e.message}}inp.value='';draw(k)});
 $('#ff').onsubmit=async e=>{e.preventDefault();const o={...v};let bad=0;
  for(const [k,l,t,req] of fields){frm.querySelectorAll('.err').forEach(x=>x.id==='e-'+k&&(x.textContent=''));
   if(t==='img'||t==='imgs'){o[k]=t==='img'?(W[k][0]??null):W[k];if(req&&!W[k].length){$('#e-'+k).textContent='Pilih foto terlebih dahulu.';bad=1}continue}
   const el=frm.querySelector(`[name=${k}]`);let val=t==='check'?el.checked:t==='number'?(el.value===''?0:Number(el.value)):el.value.trim();
   if(req&&(val===''||val===0&&t==='number'&&k==='price'&&false)){$('#e-'+k).textContent='Wajib diisi.';bad=1}
   if(k==='wa'&&!/^(\+?62|0)8\d{7,12}$/.test(val.replace(/[\s-]/g,''))){$('#e-wa').textContent='Nomor tidak valid, contoh: 082332651558.';bad=1}
   if((k==='maps'||k==='mapsEmbed')&&val&&!/^https?:\/\//.test(val)){$('#e-'+k).textContent='Harus diawali https://';bad=1}
   o[k]=val}
  if(bad)return;delete o.demo;
  try{if(store){if(store==='gallery'&&o.cover)for(const g of S.gallery)if(g.cover&&g.id!==o.id)await put('gallery',{...g,cover:false});await put(store,o)}else await put('kv',{...o,key:'profile'});
   await load();await gc();render();frm.close();adminView();toast('Tersimpan')}catch(er){toast('Gagal menyimpan: '+er.message,1)}}}
/* ---------- Export / Import (foto ikut disimpan sebagai data URL) ---------- */
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function exportDB(){try{const d={app:'kost-khalifa',version:1,date:new Date().toISOString()};
 for(const s of STORES)d[s]=await all(s);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup-kost-khalifa-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup diunduh')}catch(e){toast('Gagal export: '+e.message,1)}}
async function importDB(f){try{const d=JSON.parse(await f.text());if(d.app!=='kost-khalifa')throw new Error('Bukan file backup Kost Khalifa.');
 if(!confirm('Restore akan MENGGANTI semua data saat ini. Lanjutkan?'))return;
 for(const s of STORES){await clr(s);for(const x of d[s]||[]){if(s==='kv'&&x.key==='profile'){delete x.pin;delete x.pinHash}await put(s,x)}}
 await load();render();adminView();toast('Data berhasil dipulihkan')}catch(e){toast('Gagal import: '+e.message,1)}}
function dataView(tb){tb.innerHTML=`<div class="card" style="padding:18px;margin-bottom:12px"><h3>Backup / Export</h3><p class="sub">Unduh semua data termasuk foto dalam satu file JSON.</p><button class="btn pri" id="ex">Export data</button></div><div class="card" style="padding:18px"><h3>Restore / Import</h3><p class="sub">Pilih file backup. Data saat ini akan diganti.</p><input type="file" accept="application/json,.json" id="im"></div><p class="sub" style="margin-top:14px">Data tersimpan di Firebase Firestore dan otomatis sama di semua perangkat. Tetap lakukan backup berkala.</p>`;
 $('#ex').onclick=exportDB;$('#im').onchange=e=>e.target.files[0]&&importDB(e.target.files[0])}
/* ---------- Init ---------- */
(async()=>{try{
 if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('ISI_'))throw new Error('firebaseConfig di index.html belum diisi');
 const app=initializeApp(firebaseConfig);db=initializeFirestore(app,{ignoreUndefinedProperties:true});auth=getAuth(app);
 onAuthStateChanged(auth,u=>{unlocked=!!u});
 await load();render()}catch(e){$('#app').innerHTML=`<div class="load"><div class="empty">Gagal memuat data (${esc(e.message)}). Periksa koneksi internet dan konfigurasi Firebase.</div></div>`}})();
</script>
</body>
</html>
