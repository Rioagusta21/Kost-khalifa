};

let db;
const all=async s=>(await getDocs(collection(db,s))).docs.map(d=>({...d.data(),id:d.id}));
const get=async(s,k)=>{const d=await getDoc(doc(db,s,String(k)));return d.exists()?d.data():undefined};
const DEF={key:'profile',name:'Kost Khalifa',tagline:'Tempat tinggal nyaman di Banguntapan',desc:'Kost Khalifa berada di Jambidan Lor, Jambidan, Banguntapan, Bantul, Yogyakarta. Hubungi pemilik untuk informasi kamar, harga, dan jadwal survei.',wa:'082332651558',address:'Jambidan Lor, Jambidan, Banguntapan, Bantul, Yogyakarta',maps:'',mapsEmbed:'',hero:null,highlights:'Berlokasi di Jambidan, Banguntapan, Bantul\nInformasi kamar dan harga bisa ditanyakan langsung ke pemilik\nBisa survei lokasi dengan janji terlebih dahulu',area:'Jambidan, Banguntapan, Bantul, Yogyakarta',cta:'Temukan tempat tinggal yang nyaman di Kost Khalifa',priceNote:'Harga dapat berubah sewaktu-waktu. Hubungi pemilik untuk informasi terbaru.',waMsg:'Halo, saya tertarik dengan Kost Khalifa. Saya ingin menanyakan informasi kamar yang tersedia.'};

async function load(){
 const [imgs,prof,rooms,facilities,gallery,faqs]=await Promise.all([all('images'),get('kv','profile'),all('rooms'),all('facilities'),all('gallery'),all('faqs')]);
 urls={};imgs.forEach(i=>urls[i.id]=i.data);
 const by=a=>a.sort((x,y)=>(x.order||0)-(y.order||0)||(x.created||0)-(y.created||0)||String(x.id).localeCompare(String(y.id),undefined,{numeric:true}));
 S={profile:{...DEF,...prof},rooms:by(rooms),facilities:by(facilities),gallery:by(gallery),faqs:by(faqs)}}

/* ---------- Landing page ---------- */
function render(){const P=S.profile,av=S.rooms.filter(r=>r.status==='Tersedia').length,fs=S.facilities.filter(f=>f.active);
 const lines=x=>String(x||'').split('\n').map(s=>s.trim()).filter(Boolean),rules=lines(P.rules),tt=P.tenantType&&P.tenantType!=='Belum diisi'?P.tenantType:'',
  near=lines(P.nearby).map(l=>{const [a,...b]=l.split('|');return [a.trim(),b.join('|').trim()]});
 const hero=P.hero?`<div class="bg" style="background-image:url(${urls[P.hero]})"></div>`:'';
 const cover=S.gallery.find(g=>g.cover);
 $('#app').innerHTML=`

<section id="harga" style="background:#fff"><div class="wrap"><h2>Harga</h2><p class="sub">Bandingkan harga tiap kamar.</p>${S.rooms.length?`<div class="tw card"><table><thead><tr><th>Kamar</th><th>Luas</th><th>Harga</th><th>Deposit</th><th>Listrik & air</th><th>Status</th></tr></thead><tbody>${S.rooms.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.size)||'–'}</td><td><b>${rp(r.price)}</b> <small>${esc(r.period)}</small></td><td>${r.deposit>0?rp(r.deposit):'–'}</td><td>${r.utilitas&&r.utilitas!=='Belum diisi'?esc(r.utilitas):'–'}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Harga belum tersedia.</div>'}<p class="sub" style="margin:14px 0">${esc(P.priceNote)}</p><a class="btn wa" target="_blank" rel="noopener" href="${waLink('Halo, saya ingin cek ketersediaan kamar di '+P.name+'.')}">Cek Ketersediaan</a></div></section>
${rules.length||tt?`<section id="aturan"><div class="wrap" style="max-width:780px"><h2>Peraturan Kost</h2><p class="sub">${tt?`Kost ${esc(tt)}. `:''}Mohon dibaca sebelum survei atau booking.</p>${rules.length?`<ul class="ok card" style="padding:20px">${rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div></section>`:''}

<section id="faq" style="background:#fff"><div class="wrap" style="max-width:780px"><h2>Pertanyaan umum</h2><p class="sub">Jawaban singkat untuk pertanyaan yang sering muncul.</p>${S.faqs.length?S.faqs.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join(''):'<div class="empty">FAQ belum ditambahkan.</div>'}</div></section>
<div class="cta"><div class="wrap"><h2>${esc(P.cta)}</h2><a class="btn wa" target="_blank" rel="noopener" href="${waLink()}">💬 Tanya via WhatsApp</a></div></div>
<footer><div class="wrap"><b style="font-size:1.1rem">${esc(P.name)}</b><span>📍 ${esc(P.address)}</span><span>📞 <a href="${waLink()}" target="_blank" rel="noopener">${esc(P.wa)}</a> (WhatsApp)</span><a href="${esc(mapsUrl())}" target="_blank" rel="noopener">Buka Google Maps</a><span>© ${new Date().getFullYear()} ${esc(P.name)}. Hak cipta dilindungi.</span></div></footer>`;

 $('#links').onclick=e=>{if(e.target.tagName==='A')$('#links').classList.remove('open')};
 document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.chips button').forEach(x=>x.classList.toggle('on',x===b));roomsView()});
 document.querySelectorAll('[data-g]').forEach(f=>{const o=()=>{showImg(S.gallery.map(g=>({s:src(g.img),c:g.caption})),Math.max(0,S.gallery.findIndex(x=>x.id==f.dataset.g)))};f.onclick=o;f.onkeydown=e=>e.key==='Enter'&&o()})}
let filt='Semua';
let LB={l:[],i:0};
function lbShow(){const x=LB.l[LB.i],n=LB.l.length;$('#lbi').src=x.s;$('#lbi').alt=x.c||'Foto';$('#lbc').textContent=(x.c||'Foto')+(n>1?` (${LB.i+1}/${n})`:'');$('#lbp').hidden=$('#lbx').hidden=n<2}
function lbGo(d){LB.i=(LB.i+d+LB.l.length)%LB.l.length;lbShow()}
function showImg(l,i=0){LB={l,i};lbShow();lb.showModal()}
function costHtml(r){const c=[r.deposit>0?'Deposit '+rp(r.deposit):'',r.utilitas&&r.utilitas!=='Belum diisi'?'Listrik & air: '+r.utilitas:'',r.biayaLain||''].filter(Boolean);return c.length?`<div class="cost">${c.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:''}
async function shareRoom(id){const r=S.rooms.find(x=>x.id==id);if(!r)return;
 const url=location.origin+location.pathname+'#k-'+r.id,text=`${r.name} di ${S.profile.name} – ${rp(r.price)}${r.period}. Lihat detailnya:`;
 if(navigator.share){try{await navigator.share({title:r.name+' – '+S.profile.name,text,url})}catch(e){}return}
 window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank','noopener')}
function goDeep(){const h=location.hash;if(!h.startsWith('#k-'))return;const id=h.slice(1);if(!S.rooms.some(x=>'k-'+x.id===id))return;
 if(filt!=='Semua'){filt='Semua';roomsView()}
 setTimeout(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({block:'center'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500)}},350)}
function roomsView(){const l=S.rooms.filter(r=>filt==='Semua'||r.status===filt),el=$('#rooms');
 el.innerHTML=l.length?l.map(r=>{const ps=r.photos||[],ph=ps[0];return `<article class="card room" id="k-${r.id}"><div class="ph" data-r="${r.id}"><img loading="lazy" src="${src(ph)}" alt="${esc(r.name)}"><span class="pill ${r.status==='Terisi'?'x':''}">${esc(r.status)}</span>${r.demo?'<span class="pill d">Contoh</span>':''}</div>${ps.length>1?`<div class="rt">${ps.slice(1,4).map((id,i)=>`<img loading="lazy" data-r="${r.id}" data-i="${i+1}" src="${src(id)}" alt="Foto ${i+2} ${esc(r.name)}">`).join('')}${ps.length>4?`<span data-r="${r.id}" data-i="4">+${ps.length-4}</span>`:''}</div>`:''}<div class="b"><h3>${esc(r.name)}</h3><div class="price">${rp(r.price)} <small>${esc(r.period)}</small></div>${r.size?`<small>Luas ${esc(r.size)}</small>`:''}${costHtml(r)}<div class="tags">${(r.feats||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div><p style="color:var(--mut);font-size:.9rem">${esc(r.desc)}</p><div class="acts"><a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(roomMsg(r))}">Tanya Kamar Ini</a><button type="button" class="btn sm out" data-sh="${r.id}">🔗 Bagikan</button></div></div></article>`}).join(''):`<div class="empty" style="grid-column:1/-1">${S.rooms.length?'Tidak ada kamar dengan status ini.':'Belum ada kamar. Pemilik dapat menambahkannya lewat menu Kelola.'}</div>`;
 el.querySelectorAll('[data-r]').forEach(p=>p.onclick=()=>{const r=S.rooms.find(x=>x.id==p.dataset.r),ids=(r.photos||[]).length?r.photos:[null];showImg(ids.map(id=>({s:src(id),c:r.name})),+(p.dataset.i||0))})
 el.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>shareRoom(b.dataset.sh))}
/* ---------- Kontrol lightbox ---------- */
$('#lbp').onclick=()=>lbGo(-1);$('#lbx').onclick=()=>lbGo(1);
lb.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lbGo(-1);if(e.key==='ArrowRight')lbGo(1)});
{let x0=null;const im=$('#lbi');im.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
 im.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40&&LB.l.length>1)lbGo(dx<0?1:-1)})}
/* ---------- Init ---------- */
(async()=>{try{
 if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('ISI_'))throw new Error('firebaseConfig di index.html belum diisi');
 const app=initializeApp(firebaseConfig);db=initializeFirestore(app,{ignoreUndefinedProperties:true});
 await load();render();goDeep()}catch(e){$('#app').innerHTML=`<div class="load"><div class="empty">Gagal memuat data (${esc(e.message)}). Periksa koneksi internet dan konfigurasi Firebase.</div></div>`}})();
</script>
</body>
</html>
